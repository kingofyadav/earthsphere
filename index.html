<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>EarthSphere — Digital World</title>
    <meta name="description" content="Explore an interactive 3D Solar System and create your Human Digital Identity on EarthSphere." />
    <meta name="theme-color" content="#000005" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EarthSphere" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="EarthSphere — Digital World" />
    <meta property="og:description" content="Explore an interactive 3D Solar System and create your Human Digital Identity." />
    <meta property="og:image"       content="/logo/day-logo.png" />
    <meta property="og:site_name"   content="EarthSphere" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="EarthSphere — Digital World" />
    <meta name="twitter:description" content="Explore an interactive 3D Solar System and create your Human Digital Identity." />
    <meta name="twitter:image"       content="/logo/day-logo.png" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts — preconnect first, then async load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
